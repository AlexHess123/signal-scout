# fly.toml app configuration file generated for alex-polymarket-bot on 2026-03-31T21:24:25-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'alex-polymarket-bot'
primary_region = 'ord'

[build]

[env]
  AUDIT_LOG_PATH = '/data/trade_audit.jsonl'
  EVALUATION_LOG_PATH = '/data/trade_audit_evaluations.jsonl'

[processes]
  app = 'python bot.py --mode live'

[[mounts]]
  source = 'trade_audit'
  destination = '/data'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
