name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development checks
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Security scan
        run: bandit -q -ll -r bot.py analyze_audit.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q bot.py analyze_audit.py tests
      - name: Run offline simulation
        run: >-
          python bot.py --mode simulate --notify-via stdout --max-events 10
          --audit-log-path /tmp/signal-scout-audit.jsonl
          --evaluation-log-path /tmp/signal-scout-evaluations.jsonl
